<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101321">
  <meta name="description" content="just click">
  <title>Clicker-learning</title>
</head>
<body>
  <main class="shell">
    <button id="earn-btn" onclick="earnmoney()">Earn</button>
    <button id="rebirth-btn" onclick="rebirth()" disabled>Rebirth</button>
  
    <div>
      <input type="text" id="code-input" placeholder="Enter code...">
      <button onclick="redeemCode()">Redeem</button>
    </div>

    <h3 style="color: red;">Money: <span id="money">0</span></h3>
    <p>Rebirths: <span id="rebirths">0</span> (<span id="mult">1</span>x)</p>
  </main>

  <script>
    let money = 0;
    let rebirthCount = 0; 
    let rebirthMult = 1;
    let cht = false;

  
    let codes = {
      "bob": 500,
      "cod": 1000,
      "bolt": 2500,
      "money": 10000,
      "100k": 100000,
      "r1": 1001,
      "r2": 1001,
      "r3": 1001,
      "r4": 1001,
      "r5": 1001,
      "r6": 1001,
    };

    const earnButton = document.querySelector("#earn-btn");
    const rebirthButton = document.querySelector("#rebirth-btn");

    function updateDisplay() {
      document.getElementById("money").textContent = money;
      document.getElementById("rebirths").textContent = rebirthCount;
      document.getElementById("mult").textContent = rebirthMult;
      
     
      rebirthButton.disabled = money < 1000 || cht;
    }

    function earnmoney() {
      if (cht) return;
      
      money += 1 * rebirthMult; 
      updateDisplay();
      
      earnButton.disabled = true;
      setTimeout(() => {
        if (!cht) earnButton.disabled = false;
      }, 100);
    }

    function rebirth() {
      if (money < 1000) {
        alert("cht detected");
        cht = true;
        earnButton.disabled = true;
        rebirthButton.disabled = true;
        codes = {}; 
        money = 0;
        rebirthCount = 0;
        updateDisplay();
      } else {
        money = 0;
        rebirthCount += 1;
        rebirthMult += 0.25;
        updateDisplay();
        alert("Rebirthed! Multiplier is now " + rebirthMult + "x");
      }
    }

    function redeemCode() {
      if (cht) {
        alert("Nice try, cheater!");
        return;
      }

      const inputField = document.getElementById("code-input");
      const enteredCode = inputField.value.trim().toLowerCase(); 


      if (codes[enteredCode]) {
        money += codes[enteredCode];
        alert("Code redeemed! +$" + codes[enteredCode]);
        
        delete codes[enteredCode]; 
        inputField.value = ""; 
        updateDisplay();
      } else {
        alert("Invalid or already used code!");
      }
    }
  </script>
</body>
</html>
