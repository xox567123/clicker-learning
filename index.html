<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101321">
  <meta name="description" content="A polished clicker game that saves progress on your device.">
  <title>Clicker Learning</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b14;
      --panel: rgba(23, 27, 48, 0.92);
      --panel-border: rgba(255, 255, 255, 0.09);
      --text: #f7f8ff;
      --muted: #aeb4cc;
      --accent: #8b7cff;
      --accent-strong: #6559ea;
      --gold: #ffc857;
      --danger: #ff6978;
      --success: #55d6a4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 124, 255, 0.17), transparent 28rem),
        radial-gradient(circle at 80% 80%, rgba(85, 214, 164, 0.08), transparent 26rem),
        var(--bg);
    }

    .shell {
      width: min(520px, 100%);
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(16px);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      overflow: hidden;
      color: var(--gold);
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 800;
      text-overflow: ellipsis;
    }

    .rebirth-card {
      text-align: right;
    }

    .rebirth-card .stat-value { color: var(--success); }

    .progress-track {
      height: 8px;
      margin: 0 0 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 260ms ease;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 100ms ease, filter 160ms ease, opacity 160ms ease;
    }

    button:active:not(:disabled) { transform: scale(0.97); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: 0.42; }

    #earn-btn {
      min-height: 88px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 12px 32px rgba(101, 89, 234, 0.28);
      font-size: 1.15rem;
    }

    #rebirth-btn {
      width: 128px;
      background: rgba(85, 214, 164, 0.14);
      border: 1px solid rgba(85, 214, 164, 0.32);
      color: #9ff3ce;
    }

    .code-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      outline: none;
      background: rgba(5, 7, 16, 0.48);
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.13);
    }

    #redeem-btn {
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
    }

    .status {
      min-height: 20px;
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .shell { border-radius: 22px; }
      .actions { grid-template-columns: 1fr; }
      #rebirth-btn { width: 100%; }
      .code-box { grid-template-columns: 1fr; }
      #redeem-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Clicker Learning</h1>
      <p class="subtitle">Click, rebirth, and chase the multiplier.</p>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat">
        <span class="stat-label">Money</span>
        <span class="stat-value" id="money">0</span>
      </div>
      <div class="stat rebirth-card">
        <span class="stat-label">Rebirths</span>
        <span class="stat-value"><span id="rebirths">0</span> · <span id="mult">1</span>x</span>
      </div>
    </section>

    <div class="progress-track" aria-label="Progress to rebirth">
      <div class="progress-bar" id="rebirth-progress"></div>
    </div>

    <section class="actions">
      <button id="earn-btn" type="button">Earn +<span id="earn-amount">1</span></button>
      <button id="rebirth-btn" type="button" disabled>Rebirth</button>
    </section>

    <div class="code-box">
      <input type="text" id="code-input" placeholder="Enter code..." autocomplete="off">
      <button id="redeem-btn" type="button">Redeem</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Progress is saved on this device.</p>
  </main>

  <script>
    const SAVE_KEY = "clickerLearningSaveV1";
    const REBIRTH_COST = 1000;

    let codes = {
      bob: 500,
      cod: 1000,
      bolt: 2500,
      money: 10000,
      "100k": 100000,
      r1: 1001,
      r2: 1001,
      r3: 1001,
      r4: 1001,
      r5: 1001,
      r6: 1001
    };

    let state = loadState();

    const earnButton = document.querySelector("#earn-btn");
    const rebirthButton = document.querySelector("#rebirth-btn");
    const redeemButton = document.querySelector("#redeem-btn");
    const inputField = document.querySelector("#code-input");
    const status = document.querySelector("#status");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!saved) throw new Error("No save");

        return {
          money: Number.isFinite(saved.money) ? Math.max(0, saved.money) : 0,
          rebirthCount: Number.isFinite(saved.rebirthCount) ? Math.max(0, saved.rebirthCount) : 0,
          rebirthMult: Number.isFinite(saved.rebirthMult) ? Math.max(1, saved.rebirthMult) : 1,
          usedCodes: Array.isArray(saved.usedCodes) ? saved.usedCodes : []
        };
      } catch (error) {
        return { money: 0, rebirthCount: 0, rebirthMult: 1, usedCodes: [] };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (error) {
        setStatus("Could not save progress in this browser.", "error");
      }
    }

    function formatNumber(value) {
      return new Intl.NumberFormat(undefined, {
        maximumFractionDigits: 2
      }).format(value);
    }

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = "status" + (type ? " " + type : "");
    }

    function updateDisplay() {
      document.querySelector("#money").textContent = formatNumber(state.money);
      document.querySelector("#rebirths").textContent = formatNumber(state.rebirthCount);
      document.querySelector("#mult").textContent = formatNumber(state.rebirthMult);
      document.querySelector("#earn-amount").textContent = formatNumber(state.rebirthMult);

      rebirthButton.disabled = state.money < REBIRTH_COST;
      const progress = Math.min(100, (state.money / REBIRTH_COST) * 100);
      document.querySelector("#rebirth-progress").style.width = progress + "%";
    }

    function earnmoney() {
      state.money += state.rebirthMult;
      updateDisplay();
      saveState();

      earnButton.disabled = true;
      setTimeout(() => {
        earnButton.disabled = false;
      }, 100);
    }

    function rebirth() {
      if (state.money < REBIRTH_COST) {
        setStatus("You need " + formatNumber(REBIRTH_COST) + " money to rebirth.", "error");
        return;
      }

      state.money = 0;
      state.rebirthCount += 1;
      state.rebirthMult = Math.round((state.rebirthMult + 0.25) * 100) / 100;
      updateDisplay();
      saveState();
      setStatus("Rebirthed! Your multiplier is now " + formatNumber(state.rebirthMult) + "x.", "success");
    }

    function redeemCode() {
      const enteredCode = inputField.value.trim().toLowerCase();

      if (state.usedCodes.includes(enteredCode)) {
        setStatus("This code has already been redeemed.", "error");
        inputField.select();
        return;
      }

      if (Object.hasOwn(codes, enteredCode)) {
        const reward = codes[enteredCode];
        state.money += reward;
        state.usedCodes.push(enteredCode);
        inputField.value = "";
        updateDisplay();
        saveState();
        setStatus("Code redeemed! Added " + formatNumber(reward) + " money.", "success");
      } else {
        setStatus("Invalid or already used code.", "error");
        inputField.select();
      }
    }

    earnButton.addEventListener("click", earnmoney);
    rebirthButton.addEventListener("click", rebirth);
    redeemButton.addEventListener("click", redeemCode);
    inputField.addEventListener("keydown", event => {
      if (event.key === "Enter") redeemCode();
    });

    updateDisplay();
  </script>
</body>
</html>
